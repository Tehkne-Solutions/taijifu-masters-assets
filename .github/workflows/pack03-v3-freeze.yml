name: PACK03 v3 Candidate Freeze Gate

on:
  pull_request:
    paths:
      - 'production/first_playable/stages/mountain_dojo_night/art_pass_v3/**'
      - 'tools/freeze_pack03_v3_candidate.py'
      - 'tools/test_freeze_pack03_v3_candidate.py'
      - 'requirements-tools.txt'
      - '.github/workflows/pack03-v3-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-tools.txt

      - name: Test freezer fail-closed behavior
        run: |
          set -euo pipefail
          python tools/test_freeze_pack03_v3_candidate.py | tee pack03-v3-freezer-test.log
          grep -q 'PACK03_V3_FREEZER_TEST=PASS' pack03-v3-freezer-test.log
          grep -q 'SIGNATURE=Tehkné Solutions' pack03-v3-freezer-test.log

      - name: Probe current candidate state
        run: |
          set -euo pipefail
          python tools/freeze_pack03_v3_candidate.py | tee pack03-v3-freeze.log
          grep -Eq 'PACK03_V3_FREEZE=(WAITING|PASS)' pack03-v3-freeze.log
          grep -q 'SIGNATURE=Tehkné Solutions' pack03-v3-freeze.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PACK03-V3-FREEZE-EVIDENCE
          path: |
            pack03-v3-freezer-test.log
            pack03-v3-freeze.log
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: echo 'PACK03 v3 candidate freeze gate — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
