name: Lian Wu Rig v2.5 contact absorb pose test
on:
  pull_request:
    paths:
      - 'tools/author_lian_wu_rig_v22_contact_absorb_pose_test.py'
      - '.github/workflows/lian-wu-rig-v22-contact-absorb-pose-test.yml'
      - 'production/first_playable/lian_wu/rig_v2/**'
      - 'production/first_playable/lian_wu/first_playable_lot_01/animations/guard/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pose-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical LFS pixels
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install image dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
      - name: Build canonical body-underpaint pose test v6
        run: python3 tools/author_lian_wu_rig_v22_contact_absorb_pose_test.py
      - name: Compile tool
        run: python3 -m py_compile tools/author_lian_wu_rig_v22_contact_absorb_pose_test.py
      - name: Publish review artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIAN_WU_RIG_V25_CONTACT_ABSORB_POSE_TEST_V6
          path: /tmp/lian_wu_rig_v25_contact_absorb_v6
          if-no-files-found: error
          retention-days: 14
      - name: Assert fail closed
        run: |
          echo 'ANIMATION_AUTHORING_ALLOWED=false'
          echo 'PACK04_PROMOTION_ALLOWED=false'
          echo 'COUNTS_TOWARD_PACK04=false'
          echo 'SIGNATURE=Tehkné Solutions'
