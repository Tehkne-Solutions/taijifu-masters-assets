name: First Playable Art Preflight v2

on:
  pull_request:
    paths:
      - 'production/first_playable/characters/lian_wu/**'
      - 'production/first_playable/characters/training_rival/**'
      - 'tools/validate_first_playable_art_production_v2.py'
      - '.github/workflows/first-playable-art-preflight-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-art-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Materialize LFS objects
        run: git lfs pull

      - name: Validate released First Playable art baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_first_playable_art_production_v2.py \
            --report artifacts/first-playable-art-preflight-v2.json | tee first-playable-art-v2.log
          grep -q 'FIRST_PLAYABLE_ART_PRODUCTION_READY=true' first-playable-art-v2.log
          grep -q 'FIRST_PLAYABLE_ART_PROGRESS=89/89' first-playable-art-v2.log
          grep -q 'FIRST_PLAYABLE_CHARACTER=lian_wu frames=45/45 animations=10/10 complete=true' first-playable-art-v2.log
          grep -q 'FIRST_PLAYABLE_CHARACTER=training_rival frames=44/44 animations=9/9 complete=true' first-playable-art-v2.log
          grep -q 'SIGNATURE=Tehkné Solutions' first-playable-art-v2.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FIRST-PLAYABLE-ART-PREFLIGHT-V2
          path: |
            first-playable-art-v2.log
            artifacts/first-playable-art-preflight-v2.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        run: echo 'First Playable released art preflight v2 — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
