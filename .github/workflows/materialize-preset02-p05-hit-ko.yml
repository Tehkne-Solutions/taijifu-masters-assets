name: PRESET-02 P05 Hit KO Materializer

on:
  push:
    branches:
      - agent/preset02-p05-hit-ko
    paths:
      - 'tools/materialize_training_rival_p05_hit_ko.py'
      - '.github/workflows/materialize-preset02-p05-hit-ko.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: git lfs pull
      - name: Generate P05 Hit3 KO6
        shell: bash
        run: |
          set -euo pipefail
          ROOT='production/first_playable/training_rival'
          LOT="$ROOT/first_playable_lot_01"
          SOURCE="$ROOT/source/training_rival_master.png"
          STAGING="$LOT/__p05_materialize_staging"
          rm -rf "$STAGING"
          python tools/materialize_training_rival_p05_hit_ko.py --source "$SOURCE" --output-root "$STAGING" | tee preset02-p05-materialize.log
          grep -q 'PRESET02_P05_MATERIALIZE=PASS' preset02-p05-materialize.log
          grep -q 'PRESET02_P05_HIT=3' preset02-p05-materialize.log
          grep -q 'PRESET02_P05_KO=6' preset02-p05-materialize.log
          grep -q 'PRESET02_P05_RIGID_FALL=PASS' preset02-p05-materialize.log
          for mode in hit ko; do
            rm -rf "$LOT/animations/$mode"
            mkdir -p "$LOT/animations/$mode"
            mv "$STAGING/$mode"/*.png "$LOT/animations/$mode/"
          done
          mv "$STAGING/manifest.json" "$LOT/p05-manifest.json"
          rm -rf "$STAGING"
      - name: Commit P05 and remove disposable writer
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git config user.name 'Tehkne Solutions Automation'
          git config user.email 'automation@tehkne.solutions'
          git add -- production/first_playable/training_rival/first_playable_lot_01/animations/hit
          git add -- production/first_playable/training_rival/first_playable_lot_01/animations/ko
          git add -- production/first_playable/training_rival/first_playable_lot_01/p05-manifest.json
          git rm -- .github/workflows/materialize-preset02-p05-hit-ko.yml
          mapfile -t STAGED < <(git diff --cached --name-only)
          printf 'PRESET02_P05_STAGED=%s\n' "${STAGED[@]}"
          test "${#STAGED[@]}" -eq 11
          git commit -m 'PRESET-02 P05: materialize Hit3 KO6 and remove writer'
          git push origin HEAD:agent/preset02-p05-hit-ko
          echo 'PRESET02_P05_BRANCH_MATERIALIZATION=PASS files=10 writer_removed=true'
          echo 'PRESET02_RUNTIME_PROMOTION=BLOCKED review_and_complete_gate_required=true'
          echo 'SIGNATURE=Tehkné Solutions'
