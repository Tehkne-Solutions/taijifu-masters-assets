name: PRESET-02 P04 Guard Dodge Materializer

on:
  push:
    branches:
      - agent/preset02-p04-guard-dodge
    paths:
      - 'tools/materialize_training_rival_p04_guard_dodge.py'
      - '.github/workflows/materialize-preset02-p04-guard-dodge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Materialize LFS references
        run: git lfs pull
      - name: Generate P04 guard and dodge pack
        shell: bash
        run: |
          set -euo pipefail
          ROOT='production/first_playable/training_rival'
          LOT="$ROOT/first_playable_lot_01"
          SOURCE="$ROOT/source/training_rival_master.png"
          STAGING="$LOT/__p04_materialize_staging"
          rm -rf "$STAGING"
          python tools/materialize_training_rival_p04_guard_dodge.py --source "$SOURCE" --output-root "$STAGING" | tee preset02-p04-materialize.log
          grep -q 'PRESET02_P04_MATERIALIZE=PASS' preset02-p04-materialize.log
          grep -q 'PRESET02_P04_GUARD=3' preset02-p04-materialize.log
          grep -q 'PRESET02_P04_DODGE=5' preset02-p04-materialize.log
          grep -q 'PRESET02_P04_WEAPON_SAFE=PASS' preset02-p04-materialize.log
          for mode in guard dodge; do
            rm -rf "$LOT/animations/$mode"
            mkdir -p "$LOT/animations/$mode"
            mv "$STAGING/$mode"/*.png "$LOT/animations/$mode/"
          done
          mv "$STAGING/manifest.json" "$LOT/p04-manifest.json"
          rm -rf "$STAGING"
      - name: Commit P04 and remove disposable writer
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git config user.name 'Tehkne Solutions Automation'
          git config user.email 'automation@tehkne.solutions'
          git add -- production/first_playable/training_rival/first_playable_lot_01/animations/guard
          git add -- production/first_playable/training_rival/first_playable_lot_01/animations/dodge
          git add -- production/first_playable/training_rival/first_playable_lot_01/p04-manifest.json
          git rm -- .github/workflows/materialize-preset02-p04-guard-dodge.yml
          mapfile -t STAGED < <(git diff --cached --name-only)
          printf 'PRESET02_P04_STAGED=%s\n' "${STAGED[@]}"
          test "${#STAGED[@]}" -eq 10
          git commit -m 'PRESET-02 P04: materialize Guard3 Dodge5 and remove writer'
          git push origin HEAD:agent/preset02-p04-guard-dodge
          echo 'PRESET02_P04_BRANCH_MATERIALIZATION=PASS files=9 writer_removed=true'
          echo 'PRESET02_RUNTIME_PROMOTION=BLOCKED requires_44_of_44=true'
          echo 'SIGNATURE=Tehkné Solutions'
