name: Validate Asset Vault

on:
  pull_request:
    paths:
      - "catalog/**"
      - ".github/workflows/validate-asset-vault.yml"
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - ".github/workflows/validate-asset-vault.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da release que deve ser validada"
        required: false
        type: string

permissions:
  contents: read

jobs:
  catalog:
    name: Validate catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Assets Forge
        run: python -m pip install "git+https://github.com/Tehkne-Solutions/tehkne-assets-forge.git@107e0fe7b6e6d29812ad09c5e4645828484ceee8"
      - name: Validate pack catalog
        run: tehkne-assets-forge validate-catalog catalog/packs.json

  release-asset:
    name: Validate release asset
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current catalog
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Assets Forge
        run: python -m pip install "git+https://github.com/Tehkne-Solutions/tehkne-assets-forge.git@107e0fe7b6e6d29812ad09c5e4645828484ceee8"
      - name: Resolve release contract
        id: contract
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          catalog = json.loads(Path("catalog/packs.json").read_text(encoding="utf-8"))
          tag = os.environ.get("EVENT_TAG") or os.environ.get("INPUT_TAG")
          matches = [pack for pack in catalog["packs"] if pack["release_tag"] == tag]
          if len(matches) != 1:
              raise SystemExit(f"release tag {tag!r} must match exactly one catalog entry")
          pack = matches[0]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\n")
              output.write(f"filename={pack['filename']}\n")
              output.write(f"pack_id={pack['pack_id']}\n")
              output.write(f"expected_sha256={pack.get('sha256', '')}\n")
          PY
      - name: Download canonical ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ steps.contract.outputs.tag }}" --pattern "${{ steps.contract.outputs.filename }}" --dir release
      - name: Inspect intake safety
        shell: bash
        run: |
          set -o pipefail
          tehkne-assets-forge inspect-zip "release/${{ steps.contract.outputs.filename }}" | tee intake-report.json
      - name: Calculate checksum
        id: checksum
        shell: bash
        run: |
          set -o pipefail
          tehkne-assets-forge checksum "release/${{ steps.contract.outputs.filename }}" | tee checksum-report.json
          python - <<'PY'
          import json, os
          digest = json.load(open("checksum-report.json", encoding="utf-8"))["sha256"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha256={digest}\n")
          PY
      - name: Verify catalog checksum
        if: steps.contract.outputs.expected_sha256 != ''
        run: tehkne-assets-forge verify-checksum "release/${{ steps.contract.outputs.filename }}" "${{ steps.contract.outputs.expected_sha256 }}"
      - name: Require checksum before approval status
        env:
          EXPECTED_SHA: ${{ steps.contract.outputs.expected_sha256 }}
        run: |
          if [ -z "$EXPECTED_SHA" ]; then
            echo "::warning::Release is structurally valid, but catalog sha256 is still missing. Keep the pack pending validation."
          fi
      - name: Write validation summary
        run: |
          {
            echo "# Asset Vault validation"
            echo ""
            echo "- Pack: ${{ steps.contract.outputs.pack_id }}"
            echo "- Tag: ${{ steps.contract.outputs.tag }}"
            echo "- File: ${{ steps.contract.outputs.filename }}"
            echo "- SHA-256: ${{ steps.checksum.outputs.sha256 }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: asset-vault-validation-${{ steps.contract.outputs.pack_id }}
          path: |
            intake-report.json
            checksum-report.json
          if-no-files-found: error
