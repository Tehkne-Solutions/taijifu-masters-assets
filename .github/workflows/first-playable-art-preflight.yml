name: First Playable Art Preflight

on:
  pull_request:
    paths:
      - "production/first_playable/lian_wu/first_playable_lot_01/**"
      - "production/first_playable/training_rival/first_playable_lot_01/**"
      - ".gitattributes"
      - ".gitignore"
      - "tools/validate_first_playable_art_production.py"
      - ".github/workflows/first-playable-art-preflight.yml"
  workflow_dispatch:
    inputs:
      allow_incomplete:
        description: "Executar em modo informativo enquanto a produção está incompleta"
        required: false
        default: true
        type: boolean

jobs:
  validate-art-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materializar Git LFS
        run: git lfs pull
      - name: Resolve validation mode
        id: mode
        shell: bash
        run: |
          STRICT=true
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            LIAN_COUNT=$(find production/first_playable/lian_wu/first_playable_lot_01/animations -type f -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
            RIVAL_COUNT=$(find production/first_playable/training_rival/first_playable_lot_01/animations -type f -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
            if [[ "$LIAN_COUNT" != "44" || "$RIVAL_COUNT" != "44" ]]; then
              STRICT=false
            fi
            echo "FIRST_PLAYABLE_COUNTS=lian:$LIAN_COUNT rival:$RIVAL_COUNT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.allow_incomplete }}" == "true" ]]; then
            STRICT=false
          fi
          echo "strict=$STRICT" >> "$GITHUB_OUTPUT"
          echo "FIRST_PLAYABLE_ART_STRICT=$STRICT"
      - name: Validate production
        shell: bash
        run: |
          EXTRA=""
          if [[ "${{ steps.mode.outputs.strict }}" != "true" ]]; then
            EXTRA="--allow-incomplete"
          fi
          python tools/validate_first_playable_art_production.py $EXTRA
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-playable-art-preflight
          path: artifacts/first-playable-art-preflight.json
          retention-days: 14

# Partial packs are allowed to be incomplete only by missing-frame findings.
# All PNG/name/dimension/alpha/false-approval errors remain blocking; 88/88 restores strict mode.
# Tehkné Solutions
