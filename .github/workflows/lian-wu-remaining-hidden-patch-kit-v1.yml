name: Lian Wu Remaining Hidden Patch Kit v1

on:
  pull_request:
    paths:
      - 'tools/build_lian_wu_remaining_hidden_patch_kit_v1.py'
      - '.github/workflows/lian-wu-remaining-hidden-patch-kit-v1.yml'
      - 'tools/build_lian_wu_layered_master_authoring_kit_v2.py'
      - 'production/first_playable/lian_wu/first_playable_lot_01/animations/guard/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical LFS pixels
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install image dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88

      - name: Build Authoring Kit v2 dependency
        run: python3 tools/build_lian_wu_layered_master_authoring_kit_v2.py

      - name: Build remaining hidden patch kit v1
        run: python3 tools/build_lian_wu_remaining_hidden_patch_kit_v1.py

      - name: Compile tool
        run: python3 -m py_compile tools/build_lian_wu_remaining_hidden_patch_kit_v1.py

      - name: Publish remaining hidden patch kit
        uses: actions/upload-artifact@v4
        with:
          name: LIAN_WU_REMAINING_HIDDEN_PATCH_KIT_V1
          path: /tmp/lian_wu_remaining_hidden_patch_kit_v1
          if-no-files-found: error
          retention-days: 14

      - name: Assert fail closed
        run: |
          echo 'GENERATIVE_PIXELS_CREATED=false'
          echo 'AUTHORING_COMPLETE=false'
          echo 'CONTACT_ABSORB_ALLOWED=false'
          echo 'PACK04_PROMOTION_ALLOWED=false'
          echo 'COUNTS_TOWARD_PACK04=false'
          echo 'SIGNATURE=Tehkné Solutions'
