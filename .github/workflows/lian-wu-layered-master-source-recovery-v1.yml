name: Lian Wu Layered Master Source Recovery v1

on:
  pull_request:
    paths:
      - 'tools/recover_lian_wu_layered_master_sources_v1.py'
      - 'tools/build_lian_wu_layered_master_authoring_kit_v2.py'
      - '.github/workflows/lian-wu-layered-master-source-recovery-v1.yml'
      - 'production/first_playable/lian_wu/first_playable_lot_01/animations/guard/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-source-pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical LFS pixels
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install image dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88

      - name: Rebuild Authoring Kit v2
        run: python3 tools/build_lian_wu_layered_master_authoring_kit_v2.py

      - name: Fetch approved Character Lock binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lian-wu-character-lock
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/Tehkne-Solutions/taijifu-masters/main/assets/characters/lian_wu/character_lock/lian_wu_neutral.png \
            -o /tmp/lian-wu-character-lock/lian_wu_neutral.png
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/Tehkne-Solutions/taijifu-masters/main/assets/characters/lian_wu/character_lock/lian_wu_combat_stance.png \
            -o /tmp/lian-wu-character-lock/lian_wu_combat_stance.png
          echo '0e435757b5c8a114f3ba91653f79bc86db51ee9cf3bfb74c529efed5d4ff7ab5  /tmp/lian-wu-character-lock/lian_wu_neutral.png' | sha256sum -c -
          echo 'c8e6cd1feece7c2a54cf2279085c2a4bb33338dd6a3dcb3e4d5a2402b537631c  /tmp/lian-wu-character-lock/lian_wu_combat_stance.png' | sha256sum -c -

      - name: Recover real hidden pixels
        run: |
          python3 tools/recover_lian_wu_layered_master_sources_v1.py \
            --kit /tmp/lian_wu_layered_master_authoring_kit_v2 \
            --neutral /tmp/lian-wu-character-lock/lian_wu_neutral.png \
            --combat /tmp/lian-wu-character-lock/lian_wu_combat_stance.png \
            --out /tmp/lian_wu_layered_master_source_recovery_v1

      - name: Compile recovery tool
        run: python3 -m py_compile tools/recover_lian_wu_layered_master_sources_v1.py

      - name: Publish source recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIAN_WU_LAYERED_MASTER_SOURCE_RECOVERY_V1
          path: /tmp/lian_wu_layered_master_source_recovery_v1
          if-no-files-found: error
          retention-days: 14

      - name: Assert fail closed
        run: |
          echo 'CANONICAL_FRONT_CLEAN=RECOVERED'
          echo 'VISIBLE_CANONICAL_PIXELS=LOCKED'
          echo 'AUTHORED_LAYERS_COMPLETE=false'
          echo 'CONTACT_ABSORB_ALLOWED=false'
          echo 'PACK04_PROMOTION_ALLOWED=false'
          echo 'COUNTS_TOWARD_PACK04=false'
          echo 'SIGNATURE=Tehkné Solutions'
