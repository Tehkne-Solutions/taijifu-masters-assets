name: Lian Wu Layered Master Authoring Kit v1
on:
  pull_request:
    paths:
      - 'tools/build_lian_wu_layered_master_authoring_kit_v1.py'
      - '.github/workflows/lian-wu-layered-master-authoring-kit-v1.yml'
      - 'production/first_playable/lian_wu/rig_v2/**'
      - 'production/first_playable/lian_wu/first_playable_lot_01/animations/guard/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical LFS pixels
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install image dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
      - name: Build authoring kit
        run: python3 tools/build_lian_wu_layered_master_authoring_kit_v1.py
      - name: Compile tool
        run: python3 -m py_compile tools/build_lian_wu_layered_master_authoring_kit_v1.py
      - name: Publish authoring kit
        uses: actions/upload-artifact@v4
        with:
          name: LIAN_WU_LAYERED_MASTER_AUTHORING_KIT_V1
          path: /tmp/lian_wu_layered_master_authoring_kit_v1
          if-no-files-found: error
          retention-days: 14
      - name: Assert no authored pixels generated
        run: |
          echo 'AUTHORED_PIXELS_GENERATED=false'
          echo 'PACK04_PROMOTION_ALLOWED=false'
          echo 'SIGNATURE=Tehkné Solutions'
