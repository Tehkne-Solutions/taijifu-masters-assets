name: PACK 04 Combat Reactions & Motion

on:
  pull_request:
    paths:
      - 'packs/characters/combat_reactions/**'
      - 'tools/validate_pack04_combat_reactions.py'
      - '.github/workflows/pack04-combat-reactions.yml'
  workflow_dispatch:

jobs:
  validate-pack04:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Validate PACK 04 authored reaction intake
        run: python tools/validate_pack04_combat_reactions.py

      - name: Summary
        if: always()
        run: echo 'PACK 04 Combat Reactions & Motion — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"

# Tehkné Solutions
