name: PRESET-02 Training Rival P02

on:
  pull_request:
    paths:
      - 'production/first_playable/training_rival/first_playable_lot_01/animations/jump_start/**'
      - 'production/first_playable/training_rival/first_playable_lot_01/animations/airborne/**'
      - 'production/first_playable/training_rival/first_playable_lot_01/animations/fall/**'
      - 'production/first_playable/training_rival/first_playable_lot_01/p02-manifest.json'
      - 'tools/materialize_training_rival_p02_airborne.py'
      - 'tools/validate_training_rival_p02.py'
      - '.github/workflows/validate-training-rival-p02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p02:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Materialize LFS references
        run: git lfs pull
      - name: Validate P02 7/7 and P01 regression
        shell: bash
        run: |
          set -o pipefail
          python tools/validate_training_rival_p02.py 2>&1 | tee preset02-p02.log
          grep -q 'PRESET02_P02_FRAME_COUNT=7/7' preset02-p02.log
          grep -q 'PRESET02_P02_SEQUENCE=jump_start3+airborne2+fall2' preset02-p02.log
          grep -q 'PRESET02_P02_SAFE_CANVAS_MARGIN=PASS' preset02-p02.log
          grep -q 'PRESET02_P02_WEAPON_SAFE=PASS' preset02-p02.log
          grep -q 'PRESET02_P01_REGRESSION=PASS frames=14/14' preset02-p02.log
          grep -q 'PRESET02_RIVAL_GLOBAL_PROGRESS=21/44' preset02-p02.log
          grep -q 'PRESET02_P02=PASS' preset02-p02.log
          grep -q 'PRESET02_RUNTIME_PROMOTION=BLOCKED requires_44_of_44=true' preset02-p02.log
      - name: Build visual review sheet
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          root=Path('production/first_playable/training_rival/first_playable_lot_01/animations')
          order=[('jump_start',3),('airborne',2),('fall',2)]
          files=[]
          for mode,count in order:
              for i in range(1,count+1):
                  files.append(root/mode/f'char_training_rival__{mode}__f{i:03d}.png')
          thumb=(280,280); margin=20; cols=4; rows=2
          sheet=Image.new('RGBA',(cols*(thumb[0]+margin)+margin,rows*(thumb[1]+50)+margin),(26,26,26,255))
          draw=ImageDraw.Draw(sheet)
          for idx,path in enumerate(files):
              im=Image.open(path).convert('RGBA'); im.thumbnail(thumb,Image.Resampling.LANCZOS)
              cx=margin+(idx%cols)*(thumb[0]+margin); cy=margin+(idx//cols)*(thumb[1]+50)
              x=cx+(thumb[0]-im.width)//2; y=cy+(thumb[1]-im.height)//2
              sheet.alpha_composite(im,(x,y))
              draw.text((cx,cy+thumb[1]+6),path.stem.replace('char_training_rival__',''),fill='white')
          Path('artifacts').mkdir(exist_ok=True)
          sheet.convert('RGB').save('artifacts/PRESET02_P02_AIRBORNE_REVIEW.jpg',quality=94)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PRESET02-P02-AIRBORNE-REVIEW
          path: |
            preset02-p02.log
            artifacts/PRESET02_P02_AIRBORNE_REVIEW.jpg
            production/first_playable/training_rival/first_playable_lot_01/p02-manifest.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Summary
        run: |
          echo 'PRESET-02 P02 — 7-frame airborne review — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
          echo 'Runtime remains blocked until 44/44.' >> "$GITHUB_STEP_SUMMARY"
