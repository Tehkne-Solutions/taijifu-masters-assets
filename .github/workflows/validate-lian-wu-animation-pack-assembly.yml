name: Validate Lian Wu Animation Pack Assembly

on:
  pull_request:
    paths:
      - "intake/first_playable/FP_CHAR_01_LIAN_WU.animation-packs/**"
      - "production/first_playable/lian_wu/animation-pack-01.json"
      - "tools/assemble_first_playable_animation_packs.py"
      - "tools/validate_first_playable_spritesheet_candidate.py"
      - "tools/import_first_playable_spritesheet.py"
      - "tests/test_first_playable_animation_pack_assembly.py"
      - ".github/workflows/validate-lian-wu-animation-pack-assembly.yml"
  push:
    branches: [main]
    paths:
      - "intake/first_playable/FP_CHAR_01_LIAN_WU.animation-packs/**"
      - "production/first_playable/lian_wu/animation-pack-01.json"
      - "tools/assemble_first_playable_animation_packs.py"
      - "tools/validate_first_playable_spritesheet_candidate.py"
      - "tools/import_first_playable_spritesheet.py"
      - "tests/test_first_playable_animation_pack_assembly.py"
      - ".github/workflows/validate-lian-wu-animation-pack-assembly.yml"
  workflow_dispatch:

jobs:
  animation-pack-assembly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --upgrade Pillow pytest

      - name: Testar montador
        run: python -m pytest -q tests/test_first_playable_animation_pack_assembly.py

      - name: Preparar layout canônico
        run: python tools/prepare_first_playable_generation_batch.py

      - name: Montar candidato quando os dez packs existirem
        shell: bash
        run: |
          set -euo pipefail
          source_dir="intake/first_playable/FP_CHAR_01_LIAN_WU.animation-packs"
          if [[ ! -d "$source_dir" ]]; then
            echo "Packs artísticos ainda ausentes; testes sintéticos concluídos."
            exit 0
          fi
          mkdir -p artifacts/animation-pack-assembly
          python tools/assemble_first_playable_animation_packs.py \
            production/first_playable/lian_wu/animation-pack-01.json \
            --report artifacts/animation-pack-assembly/FP_CHAR_01_LIAN_WU.json

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lian-wu-animation-pack-assembly
          path: artifacts/animation-pack-assembly/
          if-no-files-found: ignore
          retention-days: 30

