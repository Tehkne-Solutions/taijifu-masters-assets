name: Lian Wu Rig v2 joint anchors
on:
  pull_request:
    paths:
      - 'production/first_playable/lian_wu/rig_v2/joint-anchors-v1.json'
      - 'tools/validate_lian_wu_rig_v2_joint_anchors.py'
      - '.github/workflows/lian-wu-rig-v2-joint-anchors.yml'
      - 'production/first_playable/lian_wu/first_playable_lot_01/animations/guard/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  joints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical LFS pixels
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Validate joint anchors
        run: python3 tools/validate_lian_wu_rig_v2_joint_anchors.py
      - name: Compile validator
        run: python3 -m py_compile tools/validate_lian_wu_rig_v2_joint_anchors.py
      - name: Assert no animation promotion
        run: |
          echo 'RIG_V2_JOINT_ANCHORS_FROZEN=true'
          echo 'ANIMATION_AUTHORING_ALLOWED=false'
          echo 'PACK04_PROMOTION_ALLOWED=false'
          echo 'SIGNATURE=Tehkné Solutions'
