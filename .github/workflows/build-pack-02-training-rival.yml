name: Build PACK 02 Training Rival

on:
  pull_request:
    paths:
      - 'catalog/packs.json'
      - 'production/first_playable/training_rival/**'
      - 'tools/build_pack_02_training_rival.py'
      - '.github/workflows/build-pack-02-training-rival.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pack-02:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Materialize canonical LFS assets
        run: |
          set -euo pipefail
          git lfs pull
          git lfs ls-files

      - name: Build deterministic PACK 02
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_pack_02_training_rival.py --output-dir artifacts/pack02 | tee pack02-build.log
          grep -q 'PACK02_CANONICAL=PASS frames=44/44 runtime_active=true' pack02-build.log
          grep -q 'PACK02=PASS' pack02-build.log
          test -f artifacts/pack02/PACK_02_TRAINING_RIVAL_FIRST_PLAYABLE_FINAL_v1.0.0.zip
          test -f artifacts/pack02/PACK_02_TRAINING_RIVAL_FIRST_PLAYABLE_FINAL_v1.0.0.zip.sha256
          test -f artifacts/pack02/PACK_02_RELEASE_MANIFEST.json

      - name: Inspect global archive contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          root=Path('artifacts/pack02')
          z=root/'PACK_02_TRAINING_RIVAL_FIRST_PLAYABLE_FINAL_v1.0.0.zip'
          with ZipFile(z) as f:
              names=f.namelist()
              assert 'PACK_MANIFEST.json' in names
              frames=[n for n in names if n.startswith('first_playable_lot_01/animations/') and n.endswith('.png')]
              assert len(frames)==44, len(frames)
              manifest=json.loads(f.read('PACK_MANIFEST.json').decode('utf-8'))
              assert manifest['signature']=='Tehkné Solutions'
              assert manifest['pack_id']=='pack_02_training_rival_first_playable'
              assert manifest['frame_count']==44
              assert manifest['runtime_status']=='canonical_complete_44_of_44_runtime_active'
          print(f'PACK02_ARCHIVE_INSPECTION=PASS frames={len(frames)}')
          print('SIGNATURE=Tehkné Solutions')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: PACK-02-TRAINING-RIVAL-FIRST-PLAYABLE-v1.0.0
          path: |
            artifacts/pack02/PACK_02_TRAINING_RIVAL_FIRST_PLAYABLE_FINAL_v1.0.0.zip
            artifacts/pack02/PACK_02_TRAINING_RIVAL_FIRST_PLAYABLE_FINAL_v1.0.0.zip.sha256
            artifacts/pack02/PACK_02_RELEASE_MANIFEST.json
            pack02-build.log
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo 'PACK 02 — Training Rival First Playable — global release candidate' >> "$GITHUB_STEP_SUMMARY"
          echo 'Built exclusively from the frozen 44/44 canonical runtime-active source; no art regeneration.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
