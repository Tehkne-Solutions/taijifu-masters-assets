name: PRESET-02 P03 Attack Light Materializer

on:
  push:
    branches:
      - agent/preset02-p03-attack-light
    paths:
      - 'tools/materialize_training_rival_p03_attack_light.py'
      - '.github/workflows/materialize-preset02-p03-attack-light.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Materialize LFS references
        run: git lfs pull
      - name: Generate P03 attack-light pack
        shell: bash
        run: |
          set -euo pipefail
          ROOT='production/first_playable/training_rival'
          LOT="$ROOT/first_playable_lot_01"
          SOURCE="$ROOT/source/training_rival_master.png"
          STAGING="$LOT/__p03_materialize_staging"
          rm -rf "$STAGING"
          python tools/materialize_training_rival_p03_attack_light.py --source "$SOURCE" --output-root "$STAGING" | tee preset02-p03-materialize.log
          grep -q 'PRESET02_P03_MATERIALIZE=PASS' preset02-p03-materialize.log
          grep -q 'PRESET02_P03_ATTACK_LIGHT=6' preset02-p03-materialize.log
          grep -q 'PRESET02_P03_WEAPON_SAFE=PASS' preset02-p03-materialize.log
          rm -rf "$LOT/animations/attack_light"
          mkdir -p "$LOT/animations/attack_light"
          mv "$STAGING/attack_light"/*.png "$LOT/animations/attack_light/"
          mv "$STAGING/manifest.json" "$LOT/p03-manifest.json"
          rm -rf "$STAGING"
      - name: Commit P03 and remove disposable writer atomically
        shell: bash
        run: |
          set -euo pipefail
          LOT='production/first_playable/training_rival/first_playable_lot_01'
          WRITER='.github/workflows/materialize-preset02-p03-attack-light.yml'
          git lfs install --local
          git config user.name 'Tehkne Solutions Automation'
          git config user.email 'automation@tehkne.solutions'
          git add -- "$LOT/animations/attack_light" "$LOT/p03-manifest.json"
          git rm "$WRITER"
          mapfile -t STAGED < <(git diff --cached --name-only)
          printf 'PRESET02_P03_STAGED=%s\n' "${STAGED[@]}"
          test "${#STAGED[@]}" -eq 8
          git commit -m 'PRESET-02 P03: materialize attack-light 6-frame candidate and remove writer'
          git push origin HEAD:agent/preset02-p03-attack-light
          echo 'PRESET02_P03_BRANCH_MATERIALIZATION=PASS canonical_pack_files=7 writer_removed=true'
          echo 'PRESET02_RUNTIME_PROMOTION=BLOCKED requires_44_of_44=true'
          echo 'SIGNATURE=Tehkné Solutions'
