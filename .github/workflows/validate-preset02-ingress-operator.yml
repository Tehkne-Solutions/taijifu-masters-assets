name: PRESET-02 Exact Binary Ingress Operator

on:
  pull_request:
    paths:
      - 'tools/INGRESS-PRESET02-P01.ps1'
      - 'tools/canonicalize_training_rival_master.py'
      - 'tools/materialize_training_rival_p01_weapon_safe.py'
      - 'tools/validate_training_rival_p01.py'
      - 'production/first_playable/training_rival/source/master-lock-v1.json'
      - 'production/first_playable/training_rival/source/PRESET02_P01_V3_REVIEW.json'
      - '.github/workflows/validate-preset02-ingress-operator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-operator:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Parse PowerShell operator
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/INGRESS-PRESET02-P01.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PRESET02_INGRESS_OPERATOR_PARSE=PASS'
      - name: Validate default repository-root resolution
        shell: bash
        run: |
          set +e
          OUTPUT="$(pwsh -NoProfile -File tools/INGRESS-PRESET02-P01.ps1 -MasterPath tools/INGRESS-PRESET02-P01.ps1 2>&1)"
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          test "$STATUS" -ne 0
          printf '%s\n' "$OUTPUT" | grep -Fq "PRESET02_REPO_ROOT=$GITHUB_WORKSPACE"
          printf '%s\n' "$OUTPUT" | grep -q 'PRESET02_INGRESS=BLOCKED input_not_approved'
          echo 'PRESET02_REPO_ROOT_RESOLUTION=PASS'
      - name: Validate Python argv forwarding
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(pwsh -NoProfile -File tools/INGRESS-PRESET02-P01.ps1 -MasterPath tools/INGRESS-PRESET02-P01.ps1 -ProbePythonInvocation 2>&1)"
          printf '%s\n' "$OUTPUT"
          printf '%s\n' "$OUTPUT" | grep -q 'PRESET02_PYTHON_ARGV=PASS'
          printf '%s\n' "$OUTPUT" | grep -q 'PRESET02_PYTHON_INVOCATION_PROBE=PASS'
          echo 'PRESET02_PYTHON_ARGV_FORWARDING=PASS'
      - name: Parse Python helpers
        run: |
          python -m py_compile tools/canonicalize_training_rival_master.py
          python -m py_compile tools/materialize_training_rival_p01_weapon_safe.py
          python -m py_compile tools/validate_training_rival_p01.py
          echo 'PRESET02_INGRESS_PYTHON_PARSE=PASS'
      - name: Validate fail-closed invariants
        shell: bash
        run: |
          set -euo pipefail
          FILE='tools/INGRESS-PRESET02-P01.ps1'
          grep -q '\[string\]\$RepoRoot = ""' "$FILE"
          grep -q '\$MyInvocation.MyCommand.Path' "$FILE"
          grep -q 'repo_root_invalid=' "$FILE"
          grep -q 'PRESET02_REPO_ROOT=' "$FILE"
          grep -q '\[string\[\]\]\$PythonArgs' "$FILE"
          ! grep -q '\[string\[\]\]\$Args' "$FILE"
          grep -q 'PRESET02_PYTHON_INVOCATION_PROBE=PASS' "$FILE"
          grep -q 'local_branch_has_unique_commits=' "$FILE"
          grep -q 'resumed_clean_local=true' "$FILE"
          grep -q 'remote_branch_exists=' "$FILE"
          grep -q 'de532ea47c0b16921bfb84d3826fe1a2a51cf9f10aa8f6d8b98a90d9a457be6d' "$FILE"
          grep -q '\$ApprovedRawBytes = 1273838' "$FILE"
          grep -q 'ce76243a4b89147a4900e823041b5392e2b19b13549aaa9fcd95cbf3e34d3fe3' "$FILE"
          grep -q 'canonicalize_training_rival_master.py' "$FILE"
          grep -q 'materialize_training_rival_p01_weapon_safe.py' "$FILE"
          grep -q 'validate_training_rival_source_intake.py' "$FILE"
          grep -q 'validate_training_rival_p01.py' "$FILE"
          grep -q 'validate_first_playable_art_production.py' "$FILE"
          grep -q 'git lfs install --local' "$FILE"
          grep -q 'staged_file_count=.*expected=16' "$FILE"
          grep -q 'PRESET02_RUNTIME_PROMOTION=BLOCKED requires_44_of_44=true' "$FILE"
          grep -q '67abba855b18ea6cc5ef62c4e382041d5ca69eb9902d9b3c6ead9329a163531e' tools/canonicalize_training_rival_master.py
          grep -q 'disjoint_side_leg_masks_rigid_upper_weapon' tools/materialize_training_rival_p01_weapon_safe.py
          echo 'PRESET02_INGRESS_OPERATOR_CONTRACT=PASS reporoot=true python_argv=true resumable_branch=true original_sha=true canonical_pixels=true weapon_safe=true lfs=true gates=true runtime_blocked=true'
          echo 'SIGNATURE=Tehkné Solutions'
