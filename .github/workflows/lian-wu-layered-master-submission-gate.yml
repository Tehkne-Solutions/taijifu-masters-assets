name: Lian Wu Layered Master Submission Gate
on:
  pull_request:
    paths:
      - 'production/first_playable/lian_wu/rig_v2/layered_master_authored/**'
      - 'tools/validate_lian_wu_layered_master_submission.py'
      - 'tools/build_lian_wu_layered_master_authoring_kit_v2.py'
      - '.github/workflows/lian-wu-layered-master-submission-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical LFS pixels
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install image dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
      - name: Validate authored submission boundary
        run: python3 tools/validate_lian_wu_layered_master_submission.py
      - name: Compile validator
        run: python3 -m py_compile tools/validate_lian_wu_layered_master_submission.py
      - name: Publish submission report
        uses: actions/upload-artifact@v4
        with:
          name: LIAN_WU_LAYERED_MASTER_SUBMISSION_REPORT
          path: /tmp/lian_wu_layered_master_submission_report.json
          if-no-files-found: error
          retention-days: 14
      - name: Assert fail closed
        run: |
          echo 'CANONICAL_RECONSTRUCTION_ALLOWED=false'
          echo 'CONTACT_ABSORB_POSE_TEST_ALLOWED=false'
          echo 'PACK04_PROMOTION_ALLOWED=false'
          echo 'SIGNATURE=Tehkné Solutions'
