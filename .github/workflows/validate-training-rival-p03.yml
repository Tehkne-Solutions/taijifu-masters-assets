name: PRESET-02 Training Rival P03

on:
  pull_request:
    paths:
      - 'production/first_playable/training_rival/first_playable_lot_01/animations/attack_light/**'
      - 'production/first_playable/training_rival/first_playable_lot_01/p03-manifest.json'
      - 'tools/materialize_training_rival_p03_attack_light.py'
      - 'tools/validate_training_rival_p03.py'
      - '.github/workflows/validate-training-rival-p03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p03:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Materialize LFS references
        run: git lfs pull
      - name: Validate P03 and prior-pack regressions
        shell: bash
        run: |
          set -o pipefail
          python tools/validate_training_rival_p03.py 2>&1 | tee preset02-p03.log
          grep -q 'PRESET02_P03_FRAME_COUNT=6/6' preset02-p03.log
          grep -q 'PRESET02_P03_BEATS=guard+chamber+release+impact+follow_through+recover' preset02-p03.log
          grep -q 'PRESET02_P03_WEAPON_SAFE=PASS' preset02-p03.log
          grep -q 'PRESET02_P03_DISPOSABLE_WRITER=ABSENT' preset02-p03.log
          grep -q 'PRESET02_P01_REGRESSION=PASS frames=14/14' preset02-p03.log
          grep -q 'PRESET02_P02_REGRESSION=PASS frames=7/7' preset02-p03.log
          grep -q 'PRESET02_RIVAL_GLOBAL_PROGRESS=27/44' preset02-p03.log
          grep -q 'PRESET02_P03=PASS' preset02-p03.log
      - name: Build attack-light review sheet
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          root=Path('production/first_playable/training_rival/first_playable_lot_01/animations/attack_light')
          files=[root/f'char_training_rival__attack_light__f{i:03d}.png' for i in range(1,7)]
          thumb=(300,300); margin=20; cols=3; rows=2
          sheet=Image.new('RGBA',(cols*(thumb[0]+margin)+margin,rows*(thumb[1]+50)+margin),(26,26,26,255))
          draw=ImageDraw.Draw(sheet)
          for idx,path in enumerate(files):
              im=Image.open(path).convert('RGBA'); im.thumbnail(thumb,Image.Resampling.LANCZOS)
              cx=margin+(idx%cols)*(thumb[0]+margin); cy=margin+(idx//cols)*(thumb[1]+50)
              x=cx+(thumb[0]-im.width)//2; y=cy+(thumb[1]-im.height)//2
              sheet.alpha_composite(im,(x,y))
              draw.text((cx,cy+thumb[1]+6),path.stem.replace('char_training_rival__',''),fill='white')
          Path('artifacts').mkdir(exist_ok=True)
          sheet.convert('RGB').save('artifacts/PRESET02_P03_ATTACK_LIGHT_REVIEW.jpg',quality=94)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PRESET02-P03-ATTACK-LIGHT-REVIEW
          path: |
            preset02-p03.log
            artifacts/PRESET02_P03_ATTACK_LIGHT_REVIEW.jpg
            production/first_playable/training_rival/first_playable_lot_01/p03-manifest.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Summary
        run: |
          echo 'PRESET-02 P03 — attack-light 6-frame review — Tehkné Solutions' >> "$GITHUB_STEP_SUMMARY"
          echo 'Runtime remains blocked until 44/44.' >> "$GITHUB_STEP_SUMMARY"
